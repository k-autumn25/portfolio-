<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Kang Somaliza</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B7C28A'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='700' fill='%230E0E0E'%3EKS%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0E0E0E; --panel: #161512; --panel-2: #1D1B17;
    --ink: #EAD9BD; --ink-2: #B0A088; --ink-3: #6F6553;
    --olive: #B7C28A; --line: rgba(234, 217, 189, 0.12); --red: #e38b7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--line); }
  .top__brand { font-weight: 600; font-size: 18px; }
  .top__brand span { color: var(--ink-3); font-weight: 400; margin-left: 10px; font-size: 14px; }
  .top__right { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .btn { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--ink-3); background: none; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--olive); color: var(--olive); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn--main { background: var(--olive); color: #0E0E0E; border-color: var(--olive); font-weight: 600; }
  .btn--main:hover { color: #0E0E0E; filter: brightness(1.08); }
  .btn--small { padding: 6px 12px; font-size: 13px; }

  .signin { max-width: 420px; margin: 14vh auto; padding: 0 16px; text-align: center; }
  .signin h1 { font-size: 32px; margin-bottom: 10px; }
  .signin p { color: var(--ink-2); margin-bottom: 24px; }
  .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
  .msg[data-kind="error"] { color: var(--red); }
  .msg[data-kind="ok"] { color: var(--olive); }
  .msg[data-kind="wait"] { color: var(--ink-2); }

  .wrap { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 70px); }
  .side { border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  .side button { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 12px 14px; border-radius: 10px; border: 0; background: none; cursor: pointer; color: var(--ink-2); }
  .side button:hover { background: var(--panel); color: var(--ink); }
  .side button.is-on { background: var(--panel-2); color: var(--ink); font-weight: 600; }
  .side .soon-tag { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

  main { padding: 36px clamp(20px, 4vw, 56px) 80px; max-width: 980px; }
  .page__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 8px; }
  h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .page__lead { color: var(--ink-2); margin-bottom: 28px; }
  .view { font-size: 13px; color: var(--olive); text-decoration: none; white-space: nowrap; }

  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .steps button { font-size: 13px; color: var(--ink-2); padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; cursor: pointer; }
  .steps button:hover { color: var(--ink); border-color: var(--ink-3); }
  .steps button.is-on { background: var(--ink); color: #0E0E0E; border-color: var(--ink); font-weight: 600; }

  .back { display: inline-block; color: var(--olive); font-size: 14px; text-decoration: none; margin-bottom: 18px; }
  .back:hover { text-decoration: underline; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { padding: 7px 14px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); color: var(--ink-2); background: none; cursor: pointer; }
  .tabs button:hover { color: var(--ink); border-color: var(--ink-3); }
  .tabs button.is-on { background: var(--ink); color: #0E0E0E; border-color: var(--ink); font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; margin-bottom: 22px; }
  .card h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .card__num { color: var(--olive); font-size: 13px; margin-right: 8px; }
  .card__help { color: var(--ink-3); font-size: 13.5px; margin-bottom: 20px; }
  .card__foot { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .card__foot .msg { margin: 0; }

  label, .label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  input[type=text], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; outline: none; }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--olive); }
  textarea { resize: vertical; min-height: 92px; line-height: 1.55; }
  .field { margin-bottom: 18px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; margin-bottom: 18px; }
  .check input { width: 18px; height: 18px; accent-color: var(--olive); }

  .photo { display: flex; gap: 14px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .photo img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--panel-2); }
  .photo__info { flex: 1; font-size: 13px; color: var(--ink-2); }
  .photo__info b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 2px; }
  .photo__btns { display: flex; flex-direction: column; gap: 6px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .move { display: flex; flex-direction: column; gap: 2px; }
  .move button { width: 26px; height: 20px; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; font-size: 10px; color: var(--ink-2); }
  .move button:hover { border-color: var(--olive); color: var(--olive); }
  .item input { flex: 1; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--panel-2); flex: none; }
  .item__title { flex: 1; min-width: 0; }
  .item__title b { display: block; font-weight: 500; }
  .item__title span { font-size: 13px; color: var(--ink-3); }
  .x { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 18px; padding: 0 6px; }
  .x:hover { color: var(--red); }
  .add { margin-top: 12px; }
  .del-link { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 13px; padding: 0; margin-top: 14px; }
  .del-link:hover { color: var(--red); }

  .proj { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .proj summary { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; list-style: none; }
  .proj summary::-webkit-details-marker { display: none; }
  .proj summary::after { content: "Edit ▾"; font-size: 13px; color: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 999px; padding: 5px 12px; flex: none; }
  .proj[open] summary::after { content: "Close ▴"; }
  .proj__body { padding: 18px 16px; border-top: 1px solid var(--line); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .pic { position: relative; }
  .pic img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--panel-2); display: block; }
  .pic__tools { position: absolute; inset: auto 4px 4px 4px; display: flex; justify-content: space-between; opacity: 0; transition: opacity 0.2s; }
  .pic:hover .pic__tools { opacity: 1; }
  @media (hover: none) { .pic__tools { opacity: 1; } }
  .pic__tools button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(14,14,14,0.88); color: var(--ink); cursor: pointer; font-size: 13px; line-height: 1; }
  .pic__tools button:hover { background: var(--olive); color: #0E0E0E; }
  .pic__tools .pic__x:hover { background: var(--red); }
  .up { width: 100%; aspect-ratio: 1; display: grid; place-items: center; border: 1px dashed var(--ink-3); border-radius: 8px; color: var(--ink-2); font-size: 13px; text-align: center; cursor: pointer; background: none; }
  .up:hover { border-color: var(--olive); color: var(--olive); }
  .empty-note { font-size: 13px; color: var(--ink-3); background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .soon { color: var(--ink-2); font-size: 14px; padding: 28px; border: 1px dashed var(--line); border-radius: 12px; line-height: 1.6; }
  .soon a { color: var(--olive); }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; }
    .side hr { display: none; }
    .side button { white-space: nowrap; }
    main { padding: 24px 16px 60px; }
    .row2 { grid-template-columns: 1fr; }
    .top { padding: 14px 16px; }
    .top__right .who { display: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__brand">KS <span>Admin</span></div>
  <div class="top__right">
    <span class="who" id="who"></span>
    <a class="btn btn--small" href="index.html" target="_blank" rel="noopener">Open website ↗</a>
    <button class="btn btn--small" id="signout" hidden>Sign out</button>
  </div>
</header>

<section class="signin" id="signin">
  <h1>Sign in</h1>
  <p>Only you can use this admin.</p>
  <button class="btn btn--main" id="signin-btn">Sign in with Google →</button>
  <p class="msg" id="signin-msg"></p>
</section>

<div class="wrap" id="portal" hidden>
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<script type="module" src="admin.js?v=20"></script>
</body>
</html>
