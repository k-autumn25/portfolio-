<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero name preview — pick an animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,700&family=Inter:wght@400;500;600&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E0E; --ink: #EAD9BD; --ink-2: #B0A088; --ink-3: #6F6553;
    --line: rgba(234,217,189,.10); --line-2: rgba(234,217,189,.20);
    --olive: #B7C28A;
    --serif: 'Playfair Display', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --pad-x: clamp(16px, 5vw, 64px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  /* Picker bar (preview only) */
  .picker {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 14px var(--pad-x); border-bottom: 1px solid var(--line);
    background: rgba(14,14,14,.9); backdrop-filter: blur(8px);
    font-family: var(--sans);
  }
  .picker__label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
  .picker button {
    background: none; border: 1px solid var(--line-2); color: var(--ink-2);
    font: 500 13px var(--sans); padding: 8px 16px; border-radius: 999px; cursor: pointer;
    transition: all .25s ease;
  }
  .picker button:hover { color: var(--ink); border-color: var(--ink); }
  .picker button.is-on { background: var(--olive); border-color: var(--olive); color: #1A1A14; }
  .picker .picker__replay { margin-left: auto; }

  /* Hero */
  .hero {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 140px var(--pad-x) 60px; text-align: center; position: relative;
  }
  .name {
    font-weight: 500; font-size: 13.2vw; line-height: .95; letter-spacing: -.02em;
    white-space: nowrap; user-select: none; cursor: default;
  }
  .ch { display: inline-block; will-change: transform; }
  .sp { display: inline-block; width: .28em; }
  .hint {
    margin-top: 40px; font: 400 13px var(--sans); color: var(--ink-3); letter-spacing: .06em;
    max-width: 520px; line-height: 1.6;
  }
  .hint strong { color: var(--ink-2); font-weight: 500; }

  /* 1. Graffiti swap (like the template) */
  .m-graffiti .ch { transition: color .2s ease; }
  .m-graffiti .ch.is-hit { font-family: 'Rubik Wet Paint', var(--serif); color: var(--olive); font-weight: 400; transform: rotate(-6deg) scale(1.05); }

  /* 2. Jelly */
  .m-jelly .ch.is-hit { animation: jelly .7s ease; }
  @keyframes jelly {
    0% { transform: scale(1,1); } 30% { transform: scale(1.25,.75); } 40% { transform: scale(.75,1.25); }
    50% { transform: scale(1.15,.85); } 65% { transform: scale(.95,1.05); } 75% { transform: scale(1.05,.95); } 100% { transform: scale(1,1); }
  }

  /* 3. Weight wave */
  .m-weight .ch { transition: font-weight .35s ease, font-style .35s ease, color .35s ease, transform .35s ease; }
  .m-weight .ch.w1 { font-weight: 700; font-style: italic; color: var(--olive); transform: translateY(-4%); }
  .m-weight .ch.w2 { font-weight: 600; }

  /* 4. Magnet — handled in JS (transform follows cursor) */
  .m-magnet .ch { transition: transform .25s cubic-bezier(.2,.8,.2,1); }

  /* 5. Rise up (on load) */
  .m-rise .ch { opacity: 0; transform: translateY(70%) rotate(6deg); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 55ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* 6. Drop + bounce (on load) */
  .m-drop .ch { opacity: 0; transform: translateY(-120%); animation: drop 1s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(var(--i) * 70ms); }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-120%); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }

  /* 7. Scramble — JS */
  .m-scramble .ch.is-scrambling { color: var(--olive); }

  @media (prefers-reduced-motion: reduce) {
    .ch { animation: none !important; opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="picker" id="picker">
  <span class="picker__label">Animation</span>
  <button data-mode="graffiti" class="is-on">1 · Graffiti swap</button>
  <button data-mode="jelly">2 · Jelly</button>
  <button data-mode="weight">3 · Weight wave</button>
  <button data-mode="magnet">4 · Magnet</button>
  <button data-mode="rise">5 · Rise up</button>
  <button data-mode="drop">6 · Drop &amp; bounce</button>
  <button data-mode="scramble">7 · Scramble</button>
  <button class="picker__replay" id="replay">↻ Replay</button>
</div>

<section class="hero">
  <h1 class="name" id="name" aria-label="Kang Somaliza"></h1>
  <p class="hint" id="hint"></p>
</section>

<script>
  const TEXT = "Kang Somaliza";
  const HINTS = {
    graffiti: "<strong>Hover over the letters.</strong> Each one turns into a painted graffiti letter, like the danielsun.space template.",
    jelly:    "<strong>Hover over the letters.</strong> Each one squishes and wobbles like jelly.",
    weight:   "<strong>Move across the name.</strong> The letter under your mouse turns bold and italic in olive, and the letters next to it thicken a little.",
    magnet:   "<strong>Move your mouse near the name.</strong> Letters lean toward your cursor like a magnet.",
    rise:     "<strong>Plays when the page loads.</strong> Letters slide up one by one. Press Replay to watch again.",
    drop:     "<strong>Plays when the page loads.</strong> Letters drop from above and bounce. Press Replay to watch again.",
    scramble: "<strong>Plays on load and on hover.</strong> Letters shuffle through random characters before landing on your name.",
  };
  const nameEl = document.getElementById("name");
  const hintEl = document.getElementById("hint");
  let mode = "graffiti";
  let chars = [];

  function build() {
    nameEl.className = "name m-" + mode;
    nameEl.innerHTML = [...TEXT].map((c, i) =>
      c === " " ? '<span class="sp"></span>' : `<span class="ch" aria-hidden="true" style="--i:${i}" data-c="${c}">${c}</span>`
    ).join("");
    chars = [...nameEl.querySelectorAll(".ch")];
    hintEl.innerHTML = HINTS[mode];
    if (mode === "scramble") chars.forEach((el, i) => setTimeout(() => scramble(el), i * 60));
  }

  // Hover effects that act on one letter
  nameEl.addEventListener("mouseover", (e) => {
    const el = e.target.closest(".ch");
    if (!el) return;
    if (mode === "graffiti") {
      el.classList.add("is-hit");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("is-hit"), 1400);
    }
    if (mode === "jelly") {
      el.classList.remove("is-hit"); void el.offsetWidth; el.classList.add("is-hit");
    }
    if (mode === "scramble") scramble(el);
  });
  nameEl.addEventListener("animationend", (e) => {
    if (mode === "jelly") e.target.classList.remove("is-hit");
  });

  // Effects that follow the mouse position
  document.addEventListener("mousemove", (e) => {
    if (mode === "weight") {
      const idx = chars.findIndex((el) => { const r = el.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 40 && e.clientY <= r.bottom + 40; });
      chars.forEach((el, i) => {
        el.classList.toggle("w1", i === idx);
        el.classList.toggle("w2", idx !== -1 && Math.abs(i - idx) === 1);
      });
    }
    if (mode === "magnet") {
      chars.forEach((el) => {
        const r = el.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy), reach = 260;
        const f = d < reach ? (1 - d / reach) * 0.35 : 0;
        el.style.transform = `translate(${dx * f}px, ${dy * f}px)`;
      });
    }
  });
  nameEl.addEventListener("mouseleave", () => {
    if (mode === "weight") chars.forEach((el) => el.classList.remove("w1", "w2"));
  });
  document.addEventListener("mouseleave", () => {
    if (mode === "magnet") chars.forEach((el) => (el.style.transform = ""));
  });

  // Scramble one letter
  const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz*#%&@";
  function scramble(el) {
    if (el._busy) return;
    el._busy = true; el.classList.add("is-scrambling");
    let n = 0;
    const id = setInterval(() => {
      el.textContent = POOL[Math.floor(Math.random() * POOL.length)];
      if (++n > 8) { clearInterval(id); el.textContent = el.dataset.c; el.classList.remove("is-scrambling"); el._busy = false; }
    }, 45);
  }

  // Picker
  document.getElementById("picker").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mode]");
    if (!b) return;
    document.querySelectorAll("#picker [data-mode]").forEach((x) => x.classList.toggle("is-on", x === b));
    mode = b.dataset.mode;
    build();
  });
  document.getElementById("replay").addEventListener("click", build);

  build();
</script>
</body>
</html>
